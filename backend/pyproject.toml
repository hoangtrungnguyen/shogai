[project]
name = "shogai"
version = "0.1.0"
description = "Shōgai — personal relationship advisor backend (FastAPI + Gemini, markdown-folder database)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "google-genai>=1.20",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",  # talks to your Shōgai Relay
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
shogai = "shogai.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shogai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
