[project]
name = "shogai-relay"
version = "0.1.0"
description = "Shōgai Relay — key-gated info requests between people and their local Shōgai app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
shogai-relay = "shogai_relay.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shogai_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
